name: Docker

on:
  workflow_dispatch:

  push:
    branches: master

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./proxy
            tag: proxy

          - context: ./rendertron
            tag: latest

          - context: ./tracer
            tag: tracer

      fail-fast: false

    name: Docker (dockette/rendertron:${{ matrix.tag }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context  }}
          push: true
          tags: |
            dockette/rendertron:${{ matrix.tag }}
            ${{ matrix.tag == 'latest' && format('dockette/rendertron:{0}', steps.version.outputs.version) || '' }}
          platforms: linux/amd64 # linux/arm64

  release:
    name: "Release"
    needs: docker
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$(cat VERSION)" || gh release create "$(cat VERSION)" --generate-notes

  docs:
    name: "Docs"
    needs: docker
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/rendertron"
